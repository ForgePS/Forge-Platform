# Gitleaks config for Forge Platform CI.
# Keep allowlist narrow; prefer remediating real findings over broad ignores.

title = "Forge Platform"

[extend]
useDefault = true

[allowlist]
description = "Known false positives in docs and local tooling dumps"
paths = [
  '''(?i)\.forge-.*''',
  '''(?i)\.import-.*''',
  '''(?i)\.neris-.*''',
  '''(?i)\.ai-.*''',
  '''(?i)docs/testing/evidence/.*''',
  '''(?i)docs/forge-experience/evidence/.*''',
  '''(?i)docs/sprints/AI-NARRATIVE-ACCEPTANCE-report\.md''',
]
regexes = [
  '''forge-development-ecr-[a-z0-9-]+:[A-Za-z0-9._-]+''',
]
