name: Deploy Development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infrastructure/cdk/**"
      - "apps/platform-api/**"
      - "apps/worker-service/**"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Validate + test + nag + synth
        working-directory: infrastructure/cdk
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          FORGE_ENV: development
        run: |
          pnpm validate
          pnpm test
          pnpm nag
          pnpm synth
      - name: Deploy
        working-directory: infrastructure/cdk
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          FORGE_ENV: development
        run: pnpm deploy

      - name: Smoke health
        env:
          FORGE_ALB_DNS: ${{ vars.FORGE_ALB_DNS }}
        run: |
          if [ -z "$FORGE_ALB_DNS" ]; then
            FORGE_ALB_DNS=$(aws cloudformation describe-stacks --stack-name Forge-Development-Compute --query "Stacks[0].Outputs[?OutputKey=='ForgeComputeAlbDns'].OutputValue" --output text)
          fi
          export FORGE_ALB_DNS
          pnpm smoke:development
          curl -fsS "http://${FORGE_ALB_DNS}/ready"
