name: RMS E2E

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional Playwright grep (e.g. @smoke)"
        required: false
        default: ""

env:
  E2E_COGNITO_USERNAME: ${{ secrets.E2E_COGNITO_USERNAME }}

jobs:
  rms-e2e:
    if: env.E2E_COGNITO_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @forge/rms-web-e2e exec playwright install --with-deps chromium

      - name: Run RMS Playwright E2E
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            pnpm --filter @forge/rms-web-e2e exec playwright test --grep "${{ github.event.inputs.grep }}"
          else
            pnpm test:e2e:rms
          fi
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_COGNITO_USERNAME: ${{ secrets.E2E_COGNITO_USERNAME }}
          E2E_COGNITO_PASSWORD: ${{ secrets.E2E_COGNITO_PASSWORD }}
          E2E_COGNITO_USERNAME_2: ${{ secrets.E2E_COGNITO_USERNAME_2 }}
          E2E_COGNITO_PASSWORD_2: ${{ secrets.E2E_COGNITO_PASSWORD_2 }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rms-playwright-report
          path: apps/rms-web-e2e/playwright-report/
          retention-days: 14
