    MalwareVerdict:
      type: string
      description: Server-side malware verdict. Only CLEAN and OVERRIDE_APPROVED allow progression.
      enum:
        - NOT_SUBMITTED
        - SUBMITTED
        - SCANNING
        - CLEAN
        - INFECTED
        - SUSPICIOUS
        - SCAN_FAILED
        - SCAN_TIMEOUT
        - UNSUPPORTED
        - QUARANTINED
        - RESCAN_REQUIRED
        - OVERRIDE_APPROVED
        - OVERRIDE_DENIED
    ImportFileSecurityFields:
      type: object
      description: >
        Sensitive imported values are masked by default. import.sensitive permits
        authorized unmasking except CREDENTIAL/SECRET which never return in full.
      properties:
        malwareVerdict: { $ref: "#/components/schemas/MalwareVerdict" }
        quarantineStatus: { type: string, enum: [NONE, QUARANTINED, RELEASED, DESTROYED] }
        securityHold: { type: boolean }
        scanAttemptCount: { type: integer }
        rescanRequired: { type: boolean }
        contentHash:
          type: string
          description: SHA-256 of scanned content (integrity binding)
