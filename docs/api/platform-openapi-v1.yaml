          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessInvitation"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
    get:
      tags: [Invitations]
      summary: List invitations
      security:
        - bearerAuth: []
        - devPrincipal: []
      parameters:
