openapi: 3.0.3
info:
  title: Forge Platform API
  version: 1.0.0
  description: |
    Platform API Contract v1 (Sprint 1E). Frozen at Wave 9.

    Auth: Cognito Bearer access token, or `x-forge-dev-principal` in local/development/testing.

    Authorization is permission-based; Cognito groups are not evaluated.

    Identity bootstrap uses SECURITY DEFINER functions (ADR-029); see platform-contract-v1.md.

    Related docs: platform-contract-v1.md, platform-errors-v1.md, platform-permissions-v1.md,
    platform-events-v1.md, platform-versioning-policy.md
servers:
  - url: https://api-dev.example.com
    description: Development (HTTPS when domains block is configured; HTTP until DNS delegated)
  - url: http://localhost:3000
    description: Local
tags:
  - name: Auth
  - name: Invitations
  - name: Tenants
  - name: Organizations
  - name: Persons
  - name: Users
  - name: Memberships
  - name: Authorization
  - name: Catalog
  - name: Entitlements
  - name: Subscriptions
  - name: FeatureFlags
  - name: Configuration
  - name: Branding
  - name: Audit
  - name: Onboarding
paths:
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current principal and selectable tenants
      security:
        - bearerAuth: []
        - devPrincipal: []
      responses:
        "200":
          description: Principal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessAuthMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/select-tenant:
    post:
      tags: [Auth]
      summary: Select active tenant context
      security:
        - bearerAuth: []
        - devPrincipal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated principal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessAuthMe"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke all sessions for the current user
      security:
        - bearerAuth: []
        - devPrincipal: []
      responses:
        "200":
          description: Session version bumped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionVersion:
                            type: integer
  /api/v1/auth/invitations:
