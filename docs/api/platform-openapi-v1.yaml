components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amazon Cognito access token
    devPrincipal:
      type: apiKey
      in: header
      name: x-forge-dev-principal
      description: JSON {"userId","tenantId"} for local/development/testing only
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: Optional durable idempotency key (ADR-022)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Weak ETag W/"recordVersion" or * (ADR-023)
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid or expired access token
              details: []
              requestId: req-example
              correlationId: corr-example
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
    IdempotencyConflict:
      description: Idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
          example:
            error:
              code: IDEMPOTENCY_CONFLICT
              message: Idempotency-Key was already used with a different request body
              details: []
              requestId: req-example
              correlationId: corr-example
    PreconditionFailed:
      description: Stale If-Match
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
          example:
            error:
              code: PRECONDITION_FAILED
              message: membership was modified by another request
              details:
                - resourceType: membership
                  resourceId: "00000000-0000-4000-8000-000000000001"
                  expectedVersion: 2
                  actualVersion: 3
              requestId: req-example
              correlationId: corr-example
    PreconditionRequired:
      description: If-Match required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
          example:
            error:
              code: PRECONDITION_REQUIRED
              message: If-Match is required when updating membership
              details: []
              requestId: req-example
              correlationId: corr-example
  schemas:
    ApiMeta:
      type: object
      required: [requestId, correlationId]
      properties:
        requestId:
          type: string
        correlationId:
          type: string
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ApiSuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ApiSuccessVersionedResource:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                recordVersion:
                  type: integer
                  minimum: 1
    ApiSuccessAuthMe:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                tenantId:
                  type: string
                  format: uuid
                permissions:
                  type: array
                  items:
                    type: string
                tenants:
                  type: array
                  items:
                    type: object
                    properties:
                      tenantId:
                        type: string
                        format: uuid
                      membershipStatus:
                        type: string
                      selectable:
                        type: boolean
    ApiSuccessInvitation:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessEnvelope"
    ApiSuccessInvitationList:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessEnvelope"
    ApiErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId, correlationId]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - VALIDATION_FAILED
                - TENANT_SUSPENDED
                - TENANT_INACTIVE
                - SUBSCRIPTION_INACTIVE
                - ENTITLEMENT_REQUIRED
                - IDEMPOTENCY_CONFLICT
                - IDEMPOTENCY_IN_PROGRESS
                - PRECONDITION_REQUIRED
                - PRECONDITION_FAILED
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items: {}
            requestId:
              type: string
            correlationId:
              type: string
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    CreateTenantInput:
      type: object
      required: [tenantKey, slug, legalName, displayName]
      properties:
        tenantKey:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
        slug:
          type: string
        legalName:
          type: string
        displayName:
          type: string
        tenantType:
          type: string
          default: CUSTOMER
        timezone:
          type: string
          default: America/Chicago
        defaultLocale:
          type: string
          default: en-US
        dataRegion:
          type: string
          default: us-east-1
    CreateOrganizationInput:
      type: object
      required: [organizationTypeCode, slug, legalName, displayName]
      properties:
        organizationTypeCode:
          type: string
        slug:
          type: string
        legalName:
          type: string
        displayName:
          type: string
        parentOrganizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type: string
    CreatePersonInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    CreateInvitationInput:
      type: object
      required: [tenantId, email]
      properties:
        tenantId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        organizationId:
          type: string
          format: uuid
        roleCodes:
          type: array
          items:
            type: string
        productCodes:
          type: array
          items:
            type: string
        moduleCodes:
          type: array
          items:
            type: string
        expiresInHours:
          type: integer
          default: 168
        send:
          type: boolean
          default: true
    AcceptInvitationInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
        cognitoSubject:
          type: string
    CreateMembershipInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACTIVE]
          default: PENDING
        isDefaultTenant:
          type: boolean
          default: false
        expiresAt:
          type: string
          format: date-time
        roleCodes:
          type: array
          items:
            type: string
        productCodes:
          type: array
          items:
            type: string
        moduleCodes:
          type: array
          items:
            type: string
    PatchMembershipInput:
      type: object
      properties:
        isDefaultTenant:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
    SetMembershipRolesInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: object
            required: [roleCode]
            properties:
              roleCode:
                type: string
              organizationId:
                type: string
                format: uuid
                nullable: true
    SetMembershipProductsInput:
      type: object
      required: [productCodes]
      properties:
        productCodes:
          type: array
          items:
            type: string
        moduleCodes:
          type: array
          items:
            type: string
    StartOnboardingInput:
      type: object
      required: [customerType, tenantKey, slug, legalName, displayName]
      properties:
        customerType:
          type: string
          enum: [INDUSTRIAL, FIRE_DEPARTMENT, FIRE_ACADEMY, OTHER]
        templateCode:
          type: string
        tenantKey:
          type: string
        slug:
          type: string
        legalName:
          type: string
        displayName:
          type: string
        timezone:
          type: string
          default: America/Chicago
